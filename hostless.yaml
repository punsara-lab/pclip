build:
  system: docker

dockerfile_path: ./Dockerfile
start_command: gunicorn -b 0.0.0.0:${PORT:-8899} -w 1 --threads 4 --timeout 600 --access-logfile - app:app

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.1
  min_memory: 128
  max_memory: 512
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 100

health_check:
  type: http
  http_path: /
  interval_in_seconds: 30
